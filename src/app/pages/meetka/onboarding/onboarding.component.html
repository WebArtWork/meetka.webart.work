<div class="onboarding-page">
	<header class="onboarding-page__header">
		<h1 translate>Welcome to Meetka</h1>
		<p class="onboarding-page__hint" translate>
			Give us some info about yourself — a photo, your name, and your interests.
		</p>
	</header>

	<form
		(submit)="wFormSubmit(); $event.preventDefault()"
		class="onboarding-page__form"
	>
		<button
			type="button"
			class="onboarding-page__photo"
			(click)="openPhotoPicker()"
			[attr.aria-label]="translateService.translate('Choose a photo')()"
		>
			<p-avatar
				[image]="photo() ?? undefined"
				[icon]="photo() ? undefined : 'pi pi-camera'"
				shape="circle"
				size="xlarge"
				styleClass="onboarding-page__avatar"
			/>
			<span class="onboarding-page__photo-edit"><i class="pi pi-pencil"></i></span>
		</button>
		<input
			#fileInput
			type="file"
			accept="image/*"
			capture="environment"
			class="onboarding-page__file-input"
			(change)="onPhotoSelected($event)"
		/>

		<div class="onboarding-page__field">
			<label for="onboarding-name" translate>Your name</label>
			<input
				#nameInput
				id="onboarding-name"
				pInputText
				class="w-full"
				[placeholder]="translateService.translate('What should we call you?')()"
				[ngModel]="name()"
				(ngModelChange)="name.set($event)"
				name="name"
				(blur)="nameTouched.set(true)"
			/>
			@if (nameTouched() && nameInvalid()) {
				<small class="onboarding-page__field-error" translate>Please enter your name...</small>
			}
		</div>

		<div class="onboarding-page__field">
			<label for="onboarding-bio" translate>About you</label>
			<textarea
				id="onboarding-bio"
				pTextarea
				class="w-full"
				rows="3"
				[placeholder]="translateService.translate('Tell us a bit about yourself...')()"
				[ngModel]="bio()"
				(ngModelChange)="bio.set($event)"
				name="bio"
			></textarea>
		</div>

		<div class="onboarding-page__field">
			<label translate>Interests</label>
			<app-interests-filter [(selectedInterestIds)]="interestIds" styleClass="w-full" />
		</div>

		<button
			pButton
			type="submit"
			[disabled]="isSubmitting()"
			class="w-full"
		>
			{{ translateService.translate('Join Meetka')() }}
		</button>
	</form>
</div>
